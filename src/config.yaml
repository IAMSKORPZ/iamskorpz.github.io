site:
  name: The Entertainment Hub
  site: 'https://iamskorpz.github.io'
  base: '/'
  trailingSlash: false

metadata:
  title:
    default: The Entertainment Hub
    template: '%s — The Entertainment Hub'
  description: Discover the latest IPTV players, streaming apps, media tools, and entertainment guides.
  robots:
    index: true
    follow: true
  openGraph:
    site_name: The Entertainment Hub
    images:
      - url: '/img/authors/IAMSKORPZ_BANNER.png'
        width: 1200
        height: 630
    type: website
  twitter:
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 9
    post:
      isEnabled: true
      permalink: '/guides/%slug%'
      robots:
        index: true
    list:
      isEnabled: true
      pathname: 'guides'
      robots:
        index: true
    category:
      isEnabled: false
      pathname: 'category'
      robots:
        index: false
    tag:
      isEnabled: false
      pathname: 'tag'
      robots:
        index: false
    isRelatedPostsEnabled: true
    relatedPostsCount: 3

analytics:
  vendors:
    googleAnalytics:
      id: null

ui:
  theme: 'dark:only'
